[package]
name = "rev-core"
version = "2.0.0"
edition = "2021"
authors = ["Ronit Gupta <ronitgupta138@gmail.com>"]
description = "Autonomous reverse engineering engine and Model Context Protocol (MCP) server for binaries and applications."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ronitgupta138/Rev-Core"
homepage = "https://github.com/ronitgupta138/Rev-Core"
documentation = "https://docs.rs/rev-core"
keywords = ["reverse-engineering", "binary-analysis", "mcp", "elf", "decompilation"]
categories = ["command-line-utilities", "development-tools::profiling", "parser-implementations"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
goblin = "0.9"
iced-x86 = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.40", features = ["full"] }
colored = "2.1"
comfy-table = "8.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rustc-demangle = "0.1"
cpp_demangle = "0.4"

[[bin]]
name = "rev-core"
path = "src/main.rs"
